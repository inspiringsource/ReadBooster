name: Report a problem
description: Help us understand a reproducible ReadBooster problem without sharing private conversation data.
title: "[Bug]: "
labels: [bug]
body:
  - type: markdown
    attributes:
      value: Before posting, remove names, account details, tokens, and private AI conversation text.
  - type: input
    id: version
    attributes:
      label: ReadBooster version
      placeholder: 0.7.2
    validations:
      required: true
  - type: dropdown
    id: browser
    attributes:
      label: Browser
      options: [Chrome, Firefox, Other]
    validations:
      required: true
  - type: dropdown
    id: platform
    attributes:
      label: AI platform
      options: [ChatGPT, Google Gemini, Mistral, Claude, Not platform-specific]
    validations:
      required: true
  - type: textarea
    id: steps
    attributes:
      label: Reproduction steps
      description: Use sanitized sample content where needed.
    validations:
      required: true
  - type: textarea
    id: expected
    attributes:
      label: Expected behavior
    validations:
      required: true
  - type: textarea
    id: actual
    attributes:
      label: Actual behavior
    validations:
      required: true
  - type: textarea
    id: diagnostics
    attributes:
      label: Sanitized diagnostics
      description: Include relevant console errors, but remove conversation content and credentials.
  - type: checkboxes
    id: privacy
    attributes:
      label: Privacy check
      options:
        - label: I removed private conversation and account data from this report.
          required: true
